name: Backfill Nomad17 Translations

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Nomad17 Cycle"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: nomad17-state
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Normalize memory and translate journal
        run: node scripts/backfill-journal-translations.js
      - name: Save normalized memory and translated journal
        run: |
          mkdir -p /tmp/nomad17-backfill
          cp docs/journal.json /tmp/nomad17-backfill/journal.json
          cp data/memory.json /tmp/nomad17-backfill/memory.json

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nomad17-backfill/journal.json docs/journal.json
          cp /tmp/nomad17-backfill/memory.json data/memory.json

          if git diff --quiet -- docs/journal.json data/memory.json; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "nomad17-bot"
          git config user.email "nomad17-bot@users.noreply.github.com"
          git add docs/journal.json data/memory.json
          git commit -m "chore(agent): normalize memory and Russian journal"
          git push origin main
