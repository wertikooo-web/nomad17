name: Nomad17 Cycle

on:
  workflow_dispatch:
    inputs:
      mission:
        description: "Research mission"
        required: false
        default: ""
        type: string
      research_depth:
        description: "Research depth"
        required: false
        default: "normal"
        type: string
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nomad17.yml"
      - "run-once.js"
      - "src/**"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: nomad17-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      F916_SECRET: ${{ secrets.F916_SECRET }}
      AGENT_MODE: social
      NOMAD17_MISSION: ${{ github.event.inputs.mission || '' }}
      NOMAD17_RESEARCH_DEPTH: ${{ github.event.inputs.research_depth || 'normal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce 60-second minimum gap
        id: gap
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let lastRun = null;
          try { lastRun = JSON.parse(fs.readFileSync('data/state.json','utf8')).lastRun; } catch {}
          const age = lastRun ? Date.now() - Date.parse(lastRun) : Infinity;
          const shouldRun = !Number.isFinite(age) || age >= 60000;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${shouldRun}\n`);
          console.log(shouldRun ? 'Cycle allowed.' : `Skipped: previous cycle was ${Math.round(age/1000)}s ago.`);
          NODE

      - name: Syntax check
        if: steps.gap.outputs.should_run == 'true'
        run: |
          npm run check
          node --check src/ask-society.js

      - name: Run one Nomad17 cycle
        id: agent
        if: steps.gap.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          if [[ "$NOMAD17_MISSION" == ASK_SOCIETY::* ]]; then
            echo "Ask Society: one operator-authorized top-level post"
            timeout --signal=TERM --kill-after=10s 120s node src/ask-society.js
          elif [ -n "$NOMAD17_MISSION" ] && [ "$NOMAD17_RESEARCH_DEPTH" = "deep" ]; then
            echo "Deep research limit: 600 seconds"
            timeout --signal=TERM --kill-after=10s 600s npm run run
          else
            echo "Regular cycle limit: 120 seconds"
            timeout --signal=TERM --kill-after=10s 120s npm run run
          fi

      - name: Persist memory, journal and diagnostics
        if: always() && steps.gap.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/nomad17-state
          cp data/state.json /tmp/nomad17-state/state.json
          cp data/memory.json /tmp/nomad17-state/memory.json
          cp data/audit.json /tmp/nomad17-state/audit.json
          cp docs/journal.json /tmp/nomad17-state/journal.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/nomad17-state/state.json data/state.json
          cp /tmp/nomad17-state/memory.json data/memory.json
          cp /tmp/nomad17-state/audit.json data/audit.json
          cp /tmp/nomad17-state/journal.json docs/journal.json

          if git diff --quiet -- data/ docs/journal.json; then
            echo "No state changes to persist."
            exit 0
          fi

          git config user.name "nomad17-bot"
          git config user.email "nomad17-bot@users.noreply.github.com"
          git add data/state.json data/memory.json data/audit.json docs/journal.json
          git commit -m "chore(agent): persist Nomad17 memory and journal"
          git push origin main

      - name: Fail workflow if agent failed
        if: steps.gap.outputs.should_run == 'true' && steps.agent.outcome == 'failure'
        run: |
          echo "Nomad17 cycle failed. Diagnostics were persisted above."
          exit 1
