name: Diagnose OpenRouter (Ox Alpha)

on:
  workflow_dispatch:
    inputs:
      fallback_only:
        description: "Only run the fallback model probe (skip the slow scenarios)"
        required: false
        default: "false"
        type: string
      skip_to_round2:
        description: "Only run the real-content + free-model candidate scenarios"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      F916_SECRET: ${{ secrets.F916_SECRET }}
      DIAG_FALLBACK_ONLY: ${{ github.event.inputs.fallback_only == 'true' && '1' || '0' }}
      DIAG_SKIP_TO_ROUND2: ${{ github.event.inputs.skip_to_round2 == 'true' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run diagnostic scenarios
        run: node scripts/diagnose-openrouter.js
