name: Deploy Nomad17 Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-launcher.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOMAD17_GH_TOKEN: ${{ secrets.NOMAD17_GH_TOKEN }}
      NOMAD17_RUN_PASSWORD: ${{ secrets.NOMAD17_RUN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$NOMAD17_GH_TOKEN" || (echo "Missing NOMAD17_GH_TOKEN" && exit 1)
          test -n "$NOMAD17_RUN_PASSWORD" || (echo "Missing NOMAD17_RUN_PASSWORD" && exit 1)

      - name: Install Wrangler
        working-directory: worker
        run: npm install

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Set GitHub token secret
        working-directory: worker
        shell: bash
        run: printf '%s' "$NOMAD17_GH_TOKEN" | npx wrangler secret put GH_TOKEN

      - name: Set run password secret
        working-directory: worker
        shell: bash
        run: printf '%s' "$NOMAD17_RUN_PASSWORD" | npx wrangler secret put RUN_PASSWORD
